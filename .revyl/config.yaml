project:
    id: 3702dae9-ab4b-4538-ae3a-1b9193d74609
session:
    idle_timeout_seconds: 1800
build:
    framework: expo
    env:
        EXPO_PUBLIC_CONVEX_URL: https://patient-kudu-956.convex.cloud
        EXPO_PUBLIC_DATA_SOURCE: example
        EXPO_PUBLIC_DEV_TOOLS: "1"
    profiles:
        pull-request:
            ios:
                app_id: 15e9c542-a0bd-4560-830b-4894d9544026
                setup_commands:
                    - npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
                    - npx expo prebuild --platform ios
                build_commands:
                    - cd ios && xcodebuild -workspace turtl.xcworkspace -scheme turtl -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
                output_path: ios/build/Build/Products/Release-iphonesimulator/turtl.app
pr_review:
    enabled: true
    build:
        kind: revyl
        profile: pull-request
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
        always_verify:
            - The app launches to its first screen.
        system_prompt: |
            This proof intentionally uses EXPO_PUBLIC_DATA_SOURCE=example. Login is a demonstration control. Project screens show built-in examples; this proof does not verify live incidents or recovery. The separate /live feed and Dev panel still use the configured backend.
            Never tap anything in the Dev panel's Booking app group (Register booking app, Check now, Stage or Clear an outage or a store failure, Reset booking, Owner: turn recommendations on, Approve or Decline proposal): those controls act on a shared live backend and text the owner.
            The app opens on the example Login screen with the turtl wordmark. Tap Login (testID login-enter), Apple (login-apple), GitHub (login-github), or Sign up (login-signup); these are demonstration controls, not real authentication. Each opens Home (testID home), with the heading "Projects", a green turtle at the top right and one card per project (testIDs project-card-listener-ladder, project-card-orca, project-card-superprediction, project-card-guardian). Home and every screen reached from a project card run on built-in example data and need no setup: a card opens the project (testID project-home) with Fix (testID project-fix), Features (testID project-features) and Investigate (testID project-investigate).
            The live case feed that used to be the first screen is one tap away: scroll to the bottom of Home and tap "Live cases" (testID home-live-cases). The live case feed starts with no data. To get some, tap the "Dev" pill at the bottom right of every screen (testID dev-tools-toggle) to open the dev tools panel. In it:
            - New sample cases (testID dev-new-sample) creates one case of each kind: Outage, Bug report, Feature request.
            - Advance (testID dev-advance) moves one open case forward by one step.
            - Auto-run (testID dev-auto-run) takes every step of every sample case from pending to done in about 25 seconds.
            - Reset samples (testID dev-reset) removes the sample cases.
            - Below them, Start live run (testID dev-live-start) creates a case whose steps run on the backend by themselves; it stops at "Waiting for you" until you tap Approve (testID dev-live-approve) or Decline (testID dev-live-decline), and Clear live runs (testID dev-live-clear) removes those cases.
            Create sample cases before you judge the case feed or a case screen, and tap the pill again to close the panel when it covers what you are checking. When you finish, open the panel and tap Reset samples.
